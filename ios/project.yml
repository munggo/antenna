name: PiRemote
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: ko

# 서명 팀 번호 같은 개인 값은 git 에 올리지 않는 Local.xcconfig 에 둔다(Config.xcconfig 가 있으면 읽음. Local.xcconfig.example 참고)
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: "1.18.0"

targets:
  PiRemote:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - PiRemoteUITests
    sources:
      - PiRemote
      - Shared
    dependencies:
      - package: SwiftTerm
      - target: PiRemoteWidgets
      - target: PiRemoteNotify
    entitlements:
      path: PiRemote/PiRemote.entitlements
      properties:
        # 폰 알림(Apple 푸시, Xcode 설치판은 개발용 서버)과 집중 모드에서도 보이는 승인 알림
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        # 알림 확장과 함께 보는 키체인 묶음(알림 본문을 푸는 개인 키. 배포 프로필에 팀 접두어 묶음은 기본으로 들어 있어 따로 켤 것 없음)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).piremote.shared
    info:
      path: PiRemote/Info.plist
      properties:
        CFBundleDisplayName: Antenna
        # 버전·빌드 번호는 아래 settings 값에서(TestFlight 에 올릴 때 deploy/testflight.sh 가 빌드 번호를 시각으로 매김)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # TestFlight 수출 규정 질문에 미리 답함: 운영체제가 주는 것 말고 따로 쓰는 암호화 없음
        ITSAppUsesNonExemptEncryption: false
        # 앱 화면은 한국어(원본)와 영어(Localizable.xcstrings). 폰 언어가 한국어면 한국어, 그 밖의 언어는 영어로
        # (시스템 버튼 — 뒤로·복사·붙여넣기 등 — 도 같은 언어로)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - ko
          - en
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 아이패드는 네 방향 모두(App Store 검증: 아이패드 멀티태스킹을 지원하려면 네 방향이 다 있어야 함)
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "같은 Wi-Fi의 맥 브리지를 자동으로 찾아 연결하기 위해 로컬 네트워크를 사용합니다."
        # 저장하기: 사진·동영상을 사진 앱에(추가만), 문서는 파일 앱 › 나의 iPhone › pi-remote 폴더에
        NSPhotoLibraryAddUsageDescription: "pi·Claude Code가 보낸 사진·동영상을 사진 앱에 저장합니다."
        NSCameraUsageDescription: "맥 화면의 연결 QR 코드를 찍으려고 카메라를 씁니다."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSBonjourServices:
          - _piremote._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # 주소 없이 짝지은 예전 설치판에서 올라온 폰에 한 번 넘겨줄 맥 주소(Config.xcconfig 의 LEGACY_HOST. 보통은 빈 값)
        LegacyHost: $(LEGACY_HOST)
        # 맥 pi 작업 표시(잠금 화면·다이내믹 아일랜드)
        NSSupportsLiveActivities: true
        # 알림 본문을 푸는 개인 키를 두는 키체인 묶음(앱·알림 확장이 함께 봄. Shared/PushCrypto.swift)
        PushKeychainGroup: $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).piremote.shared
        # 작업 표시를 누르면 그 탭으로(piremote://tab/<창 번호>)
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID_PREFIX).piremote
            CFBundleURLSchemes:
              - piremote
    settings:
      base:
        # 앱 식별자의 앞부분은 Config.xcconfig 의 BUNDLE_ID_PREFIX(직접 빌드하면 Local.xcconfig 에서 자신의 것으로 바꿈)
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).piremote
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # 앱 아이콘: 점 세 개 + 두 겹 고리(네이비+코랄)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # 잠금 화면·다이내믹 아일랜드 작업 표시(Live Activity)
  PiRemoteWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - PiRemoteWidgets
      - Shared
    info:
      path: PiRemoteWidgets/Info.plist
      properties:
        CFBundleDisplayName: Antenna
        # 앱과 같게: 한국어 폰은 한국어, 그 밖은 영어(PiRemoteWidgets/Localizable.xcstrings)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - ko
          - en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).piremote.widgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic

  # 알림 중계로 온 알림의 본문 풀기(Notification Service Extension). 팀원 맥은 Apple 푸시 키가 없어 알림 중계로 보내는데,
  # 중계·Apple 이 본문을 읽지 못하게 잠겨 온다(server/push-seal.mjs)
  PiRemoteNotify:
    type: app-extension
    platform: iOS
    sources:
      - PiRemoteNotify
      - Shared/PushCrypto.swift
    entitlements:
      path: PiRemoteNotify/PiRemoteNotify.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).piremote.shared
    info:
      path: PiRemoteNotify/Info.plist
      properties:
        CFBundleDisplayName: Antenna
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PushKeychainGroup: $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).piremote.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).piremote.notify
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic

  # UI 자동 시험(시뮬레이터에서 실제로 탭·스크롤해 동작 확인). 시험용 브리지(8799)가 떠 있어야 함.
  PiRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PiRemoteUITests
    dependencies:
      - target: PiRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).piremote.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
